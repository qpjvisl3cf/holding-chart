<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日股市報告 2026/10/19</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; margin: 0; padding: 24px;
         background: #f5f6f8; color: #222; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 10px; padding-left: 10px; border-left: 4px solid #999; }
  h2.up { border-color: #d32f2f; }
  h2.down { border-color: #2e7d32; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
          margin-bottom: 14px; }
  .chart-box { position: relative; height: 260px; }
  .us-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 8px; }
  .rank { display: inline-block; min-width: 24px; height: 24px; line-height: 24px; text-align: center;
           border-radius: 50%; background: #eee; color: #555; font-size: 13px; font-weight: 700; }
  .us-label { font-weight: 700; font-size: 16px; }
  .us-price { font-variant-numeric: tabular-nums; }
  .us-chg { font-weight: 700; font-variant-numeric: tabular-nums; }
  .us-vol { color: #888; font-size: 13px; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
  th { color: #888; font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.code { color: #666; font-variant-numeric: tabular-nums; }
  .pos { color: #d32f2f; }
  .neg { color: #2e7d32; }
  .muted { color: #aaa; }
  .empty { color: #999; font-size: 13px; padding: 6px 0; }
  .foot { color: #999; font-size: 12px; margin-top: 24px; text-align: center; }
  @media (max-width: 600px) {
    body { padding: 12px; }
    h1 { font-size: 19px; }
    h2 { font-size: 15px; margin-top: 20px; }
    .card { padding: 12px; border-radius: 10px; }
    .us-label { font-size: 15px; }
    table { font-size: 12px; }
    th, td { padding: 5px 5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 每日股市報告 2026/10/19</h1>
  <div class="sub">美股：市值 10B↑・成交量前 250・漲跌幅前 10　|　台股：前一交易日收盤與三大法人（外資／投信，單位：張）</div>

  <div class="card">
    <div class="chart-box"><canvas id="bar"></canvas></div>
  </div>

  <h2 class="up">🇺🇸 漲幅前 10 與台股供應鏈</h2>
  <div class="card empty">（無資料）</div>

  <h2 class="down">🇺🇸 跌幅前 10 與台股供應鏈</h2>
  <div class="card empty">（無資料）</div>

  <div class="foot">資料來源：Yahoo Finance、TWSE／TPEx 三大法人　|　每個交易日 07:00 自動更新</div>
</div>

<script>
  const ranks     = [];
  const gainVals  = [];
  const lossVals  = [];
  const gainSyms  = [];
  const lossSyms  = [];
  const gainNames = [];
  const lossNames = [];
  const XMAX = 3;

  // 在每根長條末端畫上美股代碼：漲幅在條右側、跌幅在條左側
  const symbolLabels = {
    id: 'symbolLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = '600 11px "Microsoft JhengHei", "Segoe UI", sans-serif';
      ctx.textBaseline = 'middle';
      chart.data.datasets.forEach((ds, di) => {
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((bar, i) => {
          const v = ds.data[i];
          if (v === null || v === undefined) return;
          const sym = di === 0 ? gainSyms[i] : lossSyms[i];
          ctx.fillStyle = ds.backgroundColor;
          if (v >= 0) { ctx.textAlign = 'left';  ctx.fillText(sym, bar.x + 4, bar.y); }
          else        { ctx.textAlign = 'right'; ctx.fillText(sym, bar.x - 4, bar.y); }
        });
      });
      ctx.restore();
    }
  };

  new Chart(document.getElementById('bar'), {
    type: 'bar',
    data: {
      labels: ranks,
      datasets: [
        { label: '漲幅', data: gainVals, backgroundColor: '#d32f2f',   borderRadius: 3 },
        { label: '跌幅', data: lossVals, backgroundColor: '#2e7d32', borderRadius: 3 }
      ]
    },
    plugins: [symbolLabels],
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: function(items) {
              const it = items[0];
              return (it.datasetIndex === 0 ? gainNames : lossNames)[it.dataIndex];
            },
            label: function(ctx) { const v = ctx.parsed.x; return (v >= 0 ? '▲' : '▼') + Math.abs(v).toFixed(2) + '%'; }
          }
        }
      },
      scales: {
        x: { min: -XMAX, max: XMAX, stacked: true,
              ticks: { callback: function(v) { return Math.abs(v) + '%'; } }, grid: { color: '#eee' } },
        y: { stacked: true, title: { display: true, text: '排名', color: '#888', font: { size: 11 } },
              ticks: { font: { size: 12, weight: '600' } }, grid: { display: false } }
      }
    }
  });
</script>
</body>
</html>
